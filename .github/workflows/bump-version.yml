name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      js_version:
        description: 'JavaScript SDK version to update to (optional, e.g., 0.10.0)'
        required: false
        type: string
      release_notes:
        description: 'Release notes (markdown)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update JavaScript SDK dependency
        if: inputs.js_version != ''
        run: |
          npm pkg set "dependencies.@mostly-good-metrics/javascript=^${{ inputs.js_version }}"
          npm install --package-lock-only --ignore-scripts
          echo "Updated @mostly-good-metrics/javascript to ^${{ inputs.js_version }}"

      - name: Get current version and bump
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.bump_type }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          echo "new=${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT

      - name: Update version in package.json
        run: npm version ${{ steps.version.outputs.new }} --no-git-tag-version

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: "Bump version to ${{ steps.version.outputs.new }}"
          branch: "release/${{ steps.version.outputs.new }}"
          delete-branch: true
          title: "Bump version to ${{ steps.version.outputs.new }}"
          body: |
            ${{ inputs.release_notes || 'Bug fixes and improvements' }}
