name: Native host safety

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capacitor-android-host:
    name: Real Capacitor Android host
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # Candidate core while the companion SDK fix is awaiting publication.
      # Replace this override with the published minimum dependency on release.
      - uses: actions/checkout@v4
        with:
          repository: Mostly-Good-Metrics/mostly-good-metrics-js
          ref: 4e786a51ff53e2422f9caa0b2a3fbfb90d3404b4
          path: candidate-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build candidate packages
        run: |
          npm ci
          npm run build
          cd candidate-core
          npm ci
          npm run build
      - name: Prepare isolated offline native host
        env:
          MGM_JS_DIR: ${{ github.workspace }}/candidate-core
        run: |
          cd tests/native-host
          npm ci --ignore-scripts --no-audit --no-fund
          node build-probe.mjs
          npx cap add android
          cd android
          ./gradlew :app:assembleDebug --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 tests/native-host/run-native.py
